name: diabetic_retinopathy
description: Premium healthcare application for AI-powered diabetic retinopathy screening.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  fl_chart: ^0.70.2
  camera: ^0.11.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  shimmer: ^3.0.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
